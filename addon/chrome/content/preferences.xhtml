<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<script>
  Zotero.__addonInstance__.hooks.onPrefsEvent("load", { window });
</script>
<groupbox>
  <label><html:h2 data-l10n-id="basic-title"></html:h2></label>
  <checkbox
    data-l10n-id="basic-exportNotes-takeover"
    native="true"
    preference="__prefsPrefix__.exportNotes.takeover"
  />
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="editor-title"></html:h2></label>
  <hbox align="center">
    <html:label
      for="__addonRef__-editor-expandLevel"
      data-l10n-id="editor-expandLevel-label"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="6"
      step="1"
      id="__addonRef__-editor-expandLevel"
      preference="__prefsPrefix__.workspace.outline.expandLevel"
    ></html:input>
  </hbox>
  <checkbox
    data-l10n-id="editor-keepLinks"
    native="true"
    preference="__prefsPrefix__.workspace.outline.keepLinks"
  />
  <hbox align="center">
    <html:label
      data-l10n-id="editor-noteLinkPreviewType"
      for="__addonRef__-editor-noteLinkPreviewType"
    ></html:label>
    <radiogroup
      id="__addonRef__-editor-noteLinkPreviewType"
      preference="__prefsPrefix__.editor.noteLinkPreviewType"
      orient="horizontal"
      oncommand="Zotero.__addonInstance__.api.utils.requireRestart();"
    >
      <radio data-l10n-id="editor-noteLinkPreview-hover" value="hover" />
      <radio data-l10n-id="editor-noteLinkPreview-ctrl" value="ctrl" />
      <radio data-l10n-id="editor-noteLinkPreview-disable" value="disable" />
    </radiogroup>
  </hbox>
  <checkbox
    data-l10n-id="editor-useMagicKey"
    native="true"
    preference="__prefsPrefix__.editor.useMagicKey"
  />
  <checkbox
    data-l10n-id="editor-useMagicKeyShortcut"
    native="true"
    preference="__prefsPrefix__.editor.useMagicKeyShortcut"
  />
  <checkbox
    data-l10n-id="editor-useMarkdownPaste"
    native="true"
    preference="__prefsPrefix__.editor.useMarkdownPaste"
  />
  <hbox align="center">
    <html:label
      for="__addonRef__-editor-pinTable"
      data-l10n-id="editor-pinTable-label"
    ></html:label>
    <checkbox
      data-l10n-id="__addonRef__-editor-pinTableLeft"
      native="true"
      preference="__prefsPrefix__.editor.pinTableLeft"
    />
    <checkbox
      data-l10n-id="__addonRef__-editor-pinTableTop"
      native="true"
      preference="__prefsPrefix__.editor.pinTableTop"
    />
  </hbox>
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="sync-title"></html:h2></label>
  <hbox align="center">
    <html:label
      for="__addonRef__-sync-period"
      data-l10n-id="sync-period-label"
    ></html:label>
    <html:input
      type="number"
      min="-1"
      max="3600"
      step="1"
      placeholder="-1 for disable"
      id="__addonRef__-sync-period"
      preference="__prefsPrefix__.syncPeriodSeconds"
      onchange="Zotero.__addonInstance__.api.utils.requireRestart();"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="__addonRef__-sync-attachmentFolder"
      data-l10n-id="sync-attachmentFolder-label"
    ></html:label>
    <html:input
      id="__addonRef__-sync-attachmentFolder"
      preference="__prefsPrefix__.syncAttachmentFolder"
    ></html:input>
  </hbox>
  <checkbox
    data-l10n-id="sync-autoSyncLinkedNotes"
    native="true"
    preference="__prefsPrefix__.sync.autoSyncLinkedNotes"
  />
  <checkbox
    data-l10n-id="sync-background"
    native="true"
    preference="__prefsPrefix__.sync.background"
  />
  <hbox align="center">
    <button
      onclick="Zotero.__addonInstance__.hooks.onShowSyncManager()"
      data-l10n-id="sync-manager"
    ></button>
  </hbox>
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="template-title"></html:h2></label>
  <hbox align="center">
    <button
      onclick="Zotero.__addonInstance__.hooks.onShowTemplateEditor()"
      data-l10n-id="template-editor"
    ></button>
  </hbox>
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="annotationNote-title"></html:h2></label>
  <checkbox
    data-l10n-id="annotationNote-enableCreateNoteButton"
    native="true"
    preference="__prefsPrefix__.annotationNote.enableCreateNoteButton"
  />
  <checkbox
    data-l10n-id="annotationNote-enableTagSync"
    native="true"
    preference="__prefsPrefix__.annotationNote.enableTagSync"
  />
</groupbox>
<groupbox>
  <label><html:h2>Annotation color labels</html:h2></label>
  <html:p style="opacity:0.8;margin:0 0 6px 0;">
    Assign a meaning to each highlight color. Labels appear before each annotation
    when notes are created/exported (replaces the Highlight Descriptions plugin).
    Leave blank for no label. Use <html:code>{{colorLabel}}</html:code> in the
    annotation template to control placement.
  </html:p>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#ffd400;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Yellow</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.ffd400"></html:input>
  </hbox>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#ff6666;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Red</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.ff6666"></html:input>
  </hbox>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#5fb236;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Green</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.5fb236"></html:input>
  </hbox>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#2ea8e5;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Blue</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.2ea8e5"></html:input>
  </hbox>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#a28ae5;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Purple</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.a28ae5"></html:input>
  </hbox>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#e56eee;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Magenta</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.e56eee"></html:input>
  </hbox>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#f19837;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Orange</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.f19837"></html:input>
  </hbox>
  <hbox align="center">
    <html:span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #888;background:#aaaaaa;margin-right:6px;"></html:span>
    <html:label style="width:70px;">Gray</html:label>
    <html:input style="flex:1;" placeholder="(no label)" preference="__prefsPrefix__.annotationColorLabel.aaaaaa"></html:input>
  </hbox>
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="about-title"></html:h2></label>

  <hbox>
    <label
      class="zotero-text-link keyboard-clickable"
      is="zotero-text-link"
      role="link"
      href="https://github.com/jsglazer/enhanced-notes"
      value="Homepage - GitHub"
    ></label>
  </hbox>
  <label
    data-l10n-id="help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></label>
</groupbox>
